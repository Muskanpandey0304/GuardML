version: '3.9'

services:
  # GuardML FastAPI backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    ports:
      # Localhost only. Put an authenticated reverse proxy in front for remote access.
      - "127.0.0.1:8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - MLFLOW_TRACKING_URI=sqlite:///./demo/mlruns.db
      - GUARDML_DB=/app/data/guardml.db
      - GUARDML_ENVIRONMENT=${GUARDML_ENVIRONMENT:-staging}
      # Post-write health check target (inside compose, localhost is this container)
      - GUARDML_VERIFY_URL=http://model-api:8001/health
      - GUARDML_DATA_DIR=./demo/data
      - GUARDML_REPORTS_DIR=./reports
      # Auth + CORS (compose refuses to start if the tokens are not set)
      - GUARDML_USERS=${GUARDML_USERS:?Set GUARDML_USERS in .env}
      - GUARDML_APPROVERS=${GUARDML_APPROVERS:?Set GUARDML_APPROVERS in .env}
      - GUARDML_CORS_ORIGINS=${GUARDML_CORS_ORIGINS:-http://localhost:8501}
    volumes:
      - ./demo:/app/guardml/demo
      - ./reports:/app/guardml/reports
      - guardml_db:/app/data
    command: uvicorn guardml.api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Demo model API: internal only (reachable by other containers as http://model-api:8001)
  model-api:
    build:
      context: .
      dockerfile: demo/Dockerfile
    user: "1000:1000"
    expose:
      - "8001"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///./demo/mlruns.db
      - MODEL_NAME=fraud_classifier
      - MODEL_ALIAS=production
    volumes:
      - ./demo:/app/demo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MLflow UI: internal only. It has no authentication, so it is not published.
  # To view it locally, uncomment the ports lines below (localhost only).
  mlflow:
    image: python:3.11-slim
    user: "1000:1000"
    expose:
      - "5000"
    # ports:
    #   - "127.0.0.1:5000:5000"
    environment:
      - HOME=/tmp            # writable home for the non-root user
      - PIP_NO_CACHE_DIR=1
    volumes:
      - ./demo:/app/demo
    working_dir: /app
    command: >
      sh -c "pip install --user mlflow &&
             python -m mlflow ui --backend-store-uri sqlite:///./demo/mlruns.db
             --host 0.0.0.0 --port 5000"

  # Streamlit UI
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - GUARDML_API_URL=http://api:8000
      # Optional: pre-fill the token; leave empty to use the login box.
      - GUARDML_API_TOKEN=${GUARDML_API_TOKEN:-}
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api

volumes:
  guardml_db:
